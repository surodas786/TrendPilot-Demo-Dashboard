# Local development database only. Credentials are dev-only and never used elsewhere.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trendpilot
      POSTGRES_PASSWORD: trendpilot
      POSTGRES_DB: trendpilot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trendpilot -d trendpilot"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
